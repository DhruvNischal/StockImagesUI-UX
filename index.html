<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="icon" href="add-image.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .wrapper {
            overflow-x: auto;
            display: flex;
            justify-content: space-around;
            background-color: azure;
        }

        .container {
            height: auto;
            width: 100%;
            position: absolute;
            display: block;
            padding: 2rem;
            margin: 5px;
            align-items: center;
            background-color: black;
            text-align: center;
        }

        img {
            border-radius: 35px;
            height: 250px;
            width: 250px;
            padding: 5px;
            margin: 5px;
            filter: grayscale(100%);
            box-shadow: 0 0 20px #333;
            object-fit: cover;
            border: 1px solid red;

        }

        .img1 {
            display: flex;
            padding: 5px;
            margin: 4px;
            position: relative;
            color: black;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            align-items: flex-end;
            justify-content: center;
        }

        .img1:hover {
            transform: scale(1.03);
            transition: 0.9s;
            filter: drop-shadow(0 0 10px #333);
            filter: grayscale(0%);
            color: aqua;
            font-weight: 200;
            font-style: italic;
            font-family: 'Times New Roman', Times, serif;

        }


        .img1:hover img {
            filter: grayscale(0%);

        }

        .r1 {
            justify-content: center;
            align-items: center;
            display: flex;
            height: 300px;
            overflow: hidden;
            padding: 5px;
            margin: 10px;

        }

        div p {
            position: absolute;
            justify-content: center;
            align-items: end;
            margin-bottom: 25px;
            z-index: 2;
        }
        div h1
        {
            display: flex;
            word-spacing:2px;
            /* color: white; */
            font-family: montserrat;
            color:burlywood;
            letter-spacing: 5px;
            justify-content: centre;
            
        }
    </style>

</head>

<body>
    <div class="wrapper">
        <div class="container">
            <h1 style="display: flex; justify-content: center;">My Gallery</h1>
            <div class="r1">
                <div class="img1">
                    <p>Image-1</p>
                    <img src="image1.jpg" alt="image1">
                </div>
                <div class="img1">
                    <p>Image-2</p>
                    <img src="image2.jpeg" alt="image1">
                </div>
                <div class="img1">
                    <p>Image-3</p>
                    <img src="image3.jpeg" alt="image1">
                </div>
            </div>

            <div class="r1">
                <div class="img1">
                    <p>Image-4</p>
                    <img src="image4.jpeg" alt="image1">
                </div>
                <div class="img1">
                    <p>Image-5</p>
                    <img src="image5.jpeg" alt="image1">
                </div>
                <div class="img1">
                    <p>Image-6</p>
                    <img src="image6.jpeg" alt="image1">
                </div>
            </div>

            <div class="r1">
                <div class="img1">
                    <p>Image-7</p>
                    <img src="image7.jpeg" alt="image1">
                </div>
                <div class="img1">
                    <p>Image-8</p>
                    <img src="image8.jpeg" alt="image1">
                </div>
                <div class="img1">
                    <p>Image-9</p>
                    <img src="image9.jpeg" alt="image1">
                </div>
            </div>
        </div>
    </div>


</body>

</html>
